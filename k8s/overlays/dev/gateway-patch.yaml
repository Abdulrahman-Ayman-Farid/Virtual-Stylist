apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: virtual-stylist-gateway
spec:
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - virtual-stylist.com
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - virtual-stylist.com
      tls:
        mode: SIMPLE
        credentialName: virtual-stylist-tls-dev
