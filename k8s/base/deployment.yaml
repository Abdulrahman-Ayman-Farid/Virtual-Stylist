apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-stylist
  labels:
    app: virtual-stylist
    istio.io/rev: default
  annotations:
    sidecar.istio.io/inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual-stylist
  template:
    metadata:
      labels:
        app: virtual-stylist
    spec:
      containers:
        - name: virtual-stylist
          image: virtual-stylist:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: virtual-stylist-secrets
            - configMapRef:
                name: virtual-stylist-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
