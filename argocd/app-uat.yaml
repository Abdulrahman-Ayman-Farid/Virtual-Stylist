apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: virtual-stylist-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/daytona/Virtual-Stylist.git
    targetRevision: main
    path: k8s/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: virtual-stylist-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
